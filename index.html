<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapılacaklar Listesi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Yapılacaklar</h1>

    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Yeni görev ekle..." autocomplete="off" required>
      <input id="todo-date" type="date" title="Son tarih (isteğe bağlı)">
      <button type="submit">Ekle</button>
    </form>

    <div class="filters">
      <button data-filter="all" class="active">Tümü</button>
      <button data-filter="active">Aktif</button>
      <button data-filter="done">Tamamlanan</button>
    </div>

    <ul id="todo-list"></ul>

    <footer>
      <span id="counter"></span>
      <button id="clear-done">Tamamlananları sil</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
